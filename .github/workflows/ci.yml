name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Supply-chain note: external actions are intentionally kept on major tags
# (checkout, setup-node, pnpm setup) rather than pinned to SHAs; the surface
# is the three actions below and no secrets are exposed to them.

jobs:
  test:
    name: tests + packaging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Validate packaged artifact
        run: node scripts/validate-pack.mjs

  compat:
    name: DSH compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Check the declared minimum DSH version
        run: node scripts/check-dsh-compat.mjs min

      - name: Check the latest published DSH 0.2.x
        # The script resolves the target with a semver-aware comparison
        # (prereleases sort below their stable release), verifies it against
        # the declared peer range, pins the peers to it in an ephemeral
        # manifest, runs the contract suite, and restores the committed
        # manifest and lockfile.
        run: node scripts/check-dsh-compat.mjs latest-0.2x
