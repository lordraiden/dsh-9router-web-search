name: GitHub release and storefront

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# Supply-chain note: external actions are intentionally kept on major tags
# (checkout, setup-node, pnpm setup, gh release) rather than pinned to SHAs;
# the surface is the four actions below and no secrets are exposed to them.

jobs:
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches package.json version
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          version=$(node -p "require('./package.json').version")
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v${tag} does not match package.json version ${version}"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Validate packaged artifact
        run: node scripts/validate-pack.mjs

      - name: Gate on DSH compatibility
        # The same shared check CI runs: the declared minimum plus the latest
        # published 0.2.x. A failing check stops the workflow before the
        # release is created.
        run: |
          node scripts/check-dsh-compat.mjs min
          node scripts/check-dsh-compat.mjs latest-0.2x

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
